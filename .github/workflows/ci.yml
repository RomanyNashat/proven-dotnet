# Free on a public repo (standard GitHub-hosted runners).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  installer:
    name: Installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover tests/installer -v
      - name: End to end (bash wrappers)
        if: runner.os != 'Windows'
        run: bash tests/installer/e2e.sh
      - name: End to end (PowerShell wrappers)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/installer/e2e.ps1

  content:
    name: Content
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Content checks
        run: python tools/check-content.py
      - name: Skill samples match their tested files
        run: python tools/ci/check-skill-samples.py
      # The workflows cicd-github-actions shows, and this repo's own, checked by actionlint (with shellcheck
      # for their scripts). The sample caller points at a reusable workflow that lives in the service's repo.
      - name: Workflows pass actionlint
        run: |
          curl -sSfL -o /tmp/actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          # shellcheck disable=SC2016  # the template is actionlint's, not the shell's
          /tmp/actionlint -ignore 'could not read reusable workflow file' \
            -format '{{range $e := .}}::error file={{$e.Filepath}},line={{$e.Line}},col={{$e.Column}}::{{$e.Message}}{{"\n"}}{{end}}' \
            tests/Workflows/*.yml .github/workflows/*.yml
      - name: The layer installs and uninstalls cleanly
        run: |
          sb="$(mktemp -d)/.claude"
          python tools/layer.py install .claude --claude-dir "$sb"
          test -f "$sb/rules/proven/core.md"
          python tools/layer.py uninstall proven --claude-dir "$sb"
          left="$(find "$sb" -type f -not -path '*/.layers/*' | wc -l)"
          [ "$left" -le 1 ] || { find "$sb" -type f; exit 1; }   # at most the settings.json it created

  hooks:
    name: Hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Every hook compiles
        run: python -m py_compile .claude/hooks/*.py .claude/hooks/lib/*.py
      - name: Journal keeps no personal data or secrets
        run: bash tools/ci/test-journal.sh
      - name: Subagent log
        run: bash tools/ci/test-subagent-log.sh
      - name: Worktree guard
        run: bash tools/ci/test-worktree-guard.sh
      - name: Handover helper scripts
        run: bash tools/ci/test-handover-scripts.sh
      - name: Every hook command in settings points at a script the layer installs
        run: |
          python - <<'PY'
          import json, re, sys
          s = json.load(open(".claude/settings.json"))
          missing = []
          for event, groups in s["hooks"].items():
              for g in groups:
                  for h in g["hooks"]:
                      m = re.search(r"\{HOOKS\}/(\S+\.py)", h["command"])
                      if not m or not __import__("os").path.isfile(".claude/hooks/" + m.group(1)):
                          missing.append(f"{event}: {h['command']}")
          print("\n".join(missing) or "all hook commands resolve")
          sys.exit(1 if missing else 0)
          PY
