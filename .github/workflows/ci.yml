# Free on a public repo (standard GitHub-hosted runners).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  installer:
    name: Installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover tests/installer -v
      # The known-traps scan runs on developers' Windows machines too: test it there.
      - name: Known-traps scan
        run: python -m unittest discover tests/traps -v
      # The read-only agents' hook runs on developers' Windows machines too.
      - name: Read-only guard (agents with a shell)
        run: python -m unittest discover tests/hooks -v
      - name: First fixed version (zero-vulns)
        run: python -m unittest discover tests/vulns -v
      - name: Upgrade preflight scan (dotnet-upgrade)
        run: python -m unittest discover tests/upgrade -v
      - name: Test design (trace_matrix.py)
        run: python -m unittest discover tests/testdesign -v
      - name: Mutation report (mutation-testing)
        run: python -m unittest discover tests/mutation -v
      - name: Story check (story_check.py)
        run: python -m unittest discover tests/storycheck -v
      - name: Business rules (rule_candidates.py)
        run: python -m unittest discover tests/businessrules -v
      - name: Silent failures (silent_failures.py)
        run: python -m unittest discover tests/silentfailures -v
      - name: Problem analysis (tradeoff.py)
        run: python -m unittest discover tests/problemanalysis -v
      - name: Regression bisect (bisect_regression.py)
        run: python -m unittest discover tests/bisect -v
      - name: First fixed version against nuget.org
        if: runner.os == 'Linux'
        run: python .claude/skills/zero-vulns/scripts/first_fixed.py System.Security.Cryptography.Pkcs 9.0.11
      # Exit 0 is the answer today (6.1.8 brings a fixed Pkcs; a 7.x service would still get exit 1). Both are
      # accepted: only an error fails the step.
      - name: Parent fix against nuget.org
        if: runner.os == 'Linux'
        shell: bash
        run: |
          rc=0
          python .claude/skills/zero-vulns/scripts/parent_fix.py Microsoft.Data.SqlClient System.Security.Cryptography.Pkcs --current 6.1.6 --framework net10.0 || rc=$?
          [ "$rc" -le 1 ] || exit "$rc"
      - name: CPM move check (msbuild)
        run: python -m unittest discover tests/cpm -v
      - name: End to end (bash wrappers)
        if: runner.os != 'Windows'
        run: bash tests/installer/e2e.sh
      - name: End to end (PowerShell wrappers)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/installer/e2e.ps1
      # try-first.ps1 is what a developer runs before installing: Windows PowerShell 5.1 on Windows,
      # PowerShell 7 elsewhere. It installs into a throw-away folder and exits 1 if a step failed.
      - name: try-first.ps1 (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File try-first.ps1
      - name: try-first.ps1 (PowerShell 7)
        if: runner.os != 'Windows'
        run: pwsh -NoProfile -File try-first.ps1

  content:
    name: Content
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Content checks
        run: python tools/check-content.py
      - name: Skill samples match their tested files
        run: python tools/ci/check-skill-samples.py
      - name: Skill scripts
        run: python -m unittest discover tests/coverage -v
      - name: Eval gate (its own tests)
        run: python -m unittest discover tests/evals/tools -v
      # Each description still wins the requests it should answer, and no two read alike.
      - name: Skill routing
        run: |
          python -m unittest discover tests/routing -v
          python tools/ci/check-skill-routing.py --verbose
          python tools/ci/check-listing-budget.py
      # core.md and rules/ load in every session: every rule they held is still where the inventory says,
      # and they stay inside their budget.
      - name: Always-loaded rules
        run: |
          python -m unittest discover tests/rules -v
          python tools/ci/check-rules.py
      # The workflows cicd-github-actions shows, and this repo's own, checked by actionlint (with shellcheck
      # for their scripts). The sample caller points at a reusable workflow that lives in the service's repo.
      - name: Workflows pass actionlint
        run: |
          curl -sSfL -o /tmp/actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            || { echo "::error title=actionlint::download failed"; exit 1; }
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint || { echo "::error title=actionlint::unpack failed"; exit 1; }
          /tmp/actionlint -version
          set +e
          # shellcheck disable=SC2016  # the template is actionlint's, not the shell's
          /tmp/actionlint -ignore 'could not read reusable workflow file' \
            -format '{{range $e := .}}::error file={{$e.Filepath}},line={{$e.Line}},col={{$e.Column}}::{{$e.Message}}\n{{end}}' \
            tests/Workflows/*.yml .github/workflows/*.yml
          code=$?
          [ "$code" -le 1 ] || echo "::error title=actionlint::exit $code (a fatal error, not a lint finding)"
          exit "$code"
      - name: The layer installs and uninstalls cleanly
        run: |
          sb="$(mktemp -d)/.claude"
          python tools/layer.py install .claude --claude-dir "$sb"
          test -f "$sb/rules/proven/core.md"
          python tools/layer.py uninstall proven --claude-dir "$sb"
          left="$(find "$sb" -type f -not -path '*/.layers/*' | wc -l)"
          [ "$left" -le 1 ] || { find "$sb" -type f; exit 1; }   # at most the settings.json it created

  # What no fix eval has measured yet: the harness files changed since the last commit that changed a fix
  # eval's scores.json. It only reports, in the job summary; it never fails the PR.
  eval-drift:
    name: Changed since the last fix eval
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: List the harness files changed since the last fix eval
        run: python3 tools/ci/changed-since-eval.py | tee -a "$GITHUB_STEP_SUMMARY"

  hooks:
    name: Hooks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Every hook compiles
        run: python -m py_compile .claude/hooks/*.py .claude/hooks/lib/*.py
      - name: Journal keeps no personal data or secrets
        run: bash tools/ci/test-journal.sh
      - name: Subagent log
        run: bash tools/ci/test-subagent-log.sh
      - name: Worktree guard
        run: bash tools/ci/test-worktree-guard.sh
      - name: Handover helper scripts
        run: bash tools/ci/test-handover-scripts.sh
      - name: Every hook command in settings points at a script the layer installs
        run: |
          python - <<'PY'
          import json, re, sys
          s = json.load(open(".claude/settings.json"))
          missing = []
          for event, groups in s["hooks"].items():
              for g in groups:
                  for h in g["hooks"]:
                      m = re.search(r"\{HOOKS\}/(\S+\.py)", h["command"])
                      if not m or not __import__("os").path.isfile(".claude/hooks/" + m.group(1)):
                          missing.append(f"{event}: {h['command']}")
          print("\n".join(missing) or "all hook commands resolve")
          sys.exit(1 if missing else 0)
          PY

  mutation-sample:
    name: Mutation testing sample (Stryker.NET)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      # The runner image ships SDK 11 beside it; the sample is built with 10, as a service on 10 is.
      - name: Use SDK 10
        run: echo '{"sdk":{"version":"10.0.100","rollForward":"latestFeature"}}' > global.json
      - name: Install Stryker.NET
        run: dotnet tool install dotnet-stryker --version 5.1.0 --tool-path "$RUNNER_TEMP/tools"
      # The strong tests detect every change Stryker makes; the weak ones run every line and still miss the two
      # edges (refills at zero, the window's first day). The report script must say exactly that.
      - name: Strong tests score 100, weak tests miss the two edges
        shell: bash
        run: |
          s=tests/mutation/Sample
          for p in Clinic.Rules.Tests Clinic.Rules.WeakTests; do
            (cd "$s/$p" && "$RUNNER_TEMP/tools/dotnet-stryker" --reporter json --reporter cleartext --output "../out-$p")
          done
          report=.claude/skills/mutation-testing/scripts/mutation_report.py
          python3 "$report" "$s/out-Clinic.Rules.Tests/reports/mutation-report.json" --min-score 100
          if python3 "$report" "$s/out-Clinic.Rules.WeakTests/reports/mutation-report.json" --min-score 90; then
            echo "::error::the weak tests passed the bar"; exit 1
          fi
          python3 "$report" "$s/out-Clinic.Rules.WeakTests/reports/mutation-report.json" --json \
            | python3 -c "import json,sys; r=json.load(sys.stdin); lines=sorted(m['line'] for m in r['missed']); assert lines==[16,19], lines; print('missed', lines)"
