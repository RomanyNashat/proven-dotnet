# Checks the infrastructure files the skills show (Kubernetes manifests, Bicep, Dockerfiles, compose, the
# k6 script) with the tools that run them, so a sample can't drift into a file that doesn't apply, build
# or start. The files live in tests/Infra; the skills mark the blocks that must match them.
name: infra-samples

on:
  pull_request:
    paths: ['tests/Infra/**', '.github/workflows/infra-samples.yml', '.claude/skills/docker-dotnet/**', '.claude/skills/kubernetes-dotnet/**', '.claude/skills/cronjob-patterns/**', '.claude/skills/azure-deployment/**', '.claude/skills/k6-load-testing/**']
  push:
    branches: [main]
    paths: ['tests/Infra/**', '.github/workflows/infra-samples.yml', '.claude/skills/docker-dotnet/**', '.claude/skills/kubernetes-dotnet/**', '.claude/skills/cronjob-patterns/**', '.claude/skills/azure-deployment/**', '.claude/skills/k6-load-testing/**']

permissions:
  contents: read

jobs:
  manifests:
    name: Manifests and Bicep
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Kubernetes manifests are valid (Kubernetes 1.30, strict, CRDs included)
        run: |
          curl -sSfL -o /tmp/kubeconform.tgz https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tgz -C /tmp kubeconform
          /tmp/kubeconform -strict -summary -kubernetes-version 1.30.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            tests/Infra/k8s
      - name: Bicep builds
        run: |
          curl -sSfL -o /tmp/bicep https://github.com/Azure/bicep/releases/download/v0.38.33/bicep-linux-x64
          chmod +x /tmp/bicep
          /tmp/bicep build tests/Infra/azure/container-app.bicep --stdout > /dev/null

  images:
    name: Images, compose and k6
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Install k6
        run: |
          curl -sSfL -o /tmp/k6.tgz https://github.com/grafana/k6/releases/download/v1.3.0/k6-v1.3.0-linux-amd64.tar.gz
          tar -xzf /tmp/k6.tgz -C /tmp
          echo "K6=/tmp/k6-v1.3.0-linux-amd64/k6" >> "$GITHUB_ENV"
      - name: Build, run and check
        run: bash tests/Infra/docker/check.sh
