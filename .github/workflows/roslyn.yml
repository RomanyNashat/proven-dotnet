# The Roslyn MCP server: a real NuGet build + pack on Linux and Windows, and the regression tests.
# Runs only when the server or its tests change.
name: roslyn

on:
  pull_request:
    paths: ['tools/proven-roslyn-mcp/**', 'tests/ProvenRoslynMcp.Tests/**', 'tests/Directory.Packages.props', '.github/workflows/roslyn.yml']
  push:
    branches: [main]
    paths: ['tools/proven-roslyn-mcp/**', 'tests/ProvenRoslynMcp.Tests/**', 'tests/Directory.Packages.props', '.github/workflows/roslyn.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build + pack (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build tools/proven-roslyn-mcp/ProvenRoslynMcp.csproj -c Release
      # Same packaging step install-roslyn runs, so a broken tool package fails here, not on the laptop.
      - run: dotnet pack tools/proven-roslyn-mcp/ProvenRoslynMcp.csproj -c Release -o nupkg
      # The installer as a developer runs it: Windows PowerShell 5.1 with -File from another folder, and a
      # NuGet source that can't be reached (a company feed off the VPN). Both once broke the install.
      - name: install-roslyn.ps1 the laptop's way
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          dotnet nuget add source https://feed.invalid/v3/index.json -n unreachable-feed
          Set-Location $env:RUNNER_TEMP
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\install-roslyn.ps1"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (dotnet tool list --global | Select-String -SimpleMatch 'proven.roslyn.mcp')) { Write-Error 'the tool is not installed'; exit 1 }
          dotnet nuget remove source unreachable-feed

  tests:
    name: Regression tests
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet tool install -g dotnet-stack
      # The runner image also has SDK 11, which `dotnet test` would pick while the workspace loads with
      # SDK 10. Pin SDK 10 here and in the temp folder the sample solutions are built in.
      - run: |
          dotnet new globaljson --sdk-version 10.0.100 --roll-forward latestFeature --force
          cp global.json "${TMPDIR:-/tmp}/global.json"
          dotnet --version
      - run: |
          bash tools/ci/stack-on-hang.sh 150 &
          bash tools/ci/annotate.sh dotnet test tests/ProvenRoslynMcp.Tests -c Release --logger "console;verbosity=normal" --blame-hang-timeout 4m --blame-hang-dump-type none
        env:
          ANNOTATE_TIMEOUT: '600'
          MSBUILDDISABLENODEREUSE: '1'
          DOTNET_CLI_USE_MSBUILD_SERVER: '0'
